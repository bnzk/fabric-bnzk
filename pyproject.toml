[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-bnzk"
description = "Fabric tasks and helpers for bnzk projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [
  { name = "Ben Stähli", email = "bnzk@bnzk.ch" },
]
keywords = ["fabric"]
dependencies = [
  "fab-classic",
]
# Use the version defined in the package
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/bnzk/fabric-bnzk"
Repository = "https://github.com/bnzk/fabric-bnzk"

[tool.hatch.version]
path = "fabric_bnzk/__init__.py"

[tool.hatch.build]
include = ["fabric_bnzk"]
